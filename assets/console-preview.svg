<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 620" width="790" height="620" xml:space="preserve">
  <defs>
    <style>
      .term-font {
        font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
        font-size: 13.5px;
        letter-spacing: 0px;
      }
      .window-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #94a3b8;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Window Background with drop shadow -->
  <rect x="4" y="4" width="782" height="612" rx="10" ry="10" fill="#0c1017" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Terminal Header Bar -->
  <path d="M 4,14 A 10,10 0 0,1 14,4 L 776,4 A 10,10 0 0,1 786,14 L 786,38 L 4,38 Z" fill="#161b22" />
  <line x1="4" y1="38" x2="786" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="22" cy="21" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="38" cy="21" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="54" cy="21" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Title -->
  <text x="76" y="25" class="window-title">PowerShell (Admin) - Windows Printer Sharing Fix v2.4.0</text>
  <text x="24" y="54" class="term-font"><tspan fill="#38bdf8">======================================================================================</tspan></text>
  <text x="24" y="74" class="term-font"><tspan fill="#4ade80">   WINDOWS PRINTER SHARING FIX  |  Windows Network Printer Repair Tool</tspan></text>
  <text x="24" y="94" class="term-font"><tspan fill="#38bdf8">   Version: 2.4.0  |  System: WINDOWS 11 PRO 24H2 26200 64-BIT</tspan></text>
  <text x="24" y="114" class="term-font"><tspan fill="#94a3b8">   Computer: DESKTOP-OFFICE01  |  User: Administrator</tspan></text>
  <text x="24" y="134" class="term-font"><tspan fill="#94a3b8">   STATUS: </tspan><tspan fill="#4ade80">Spooler [RUNNING] </tspan><tspan fill="#64748b">| </tspan><tspan fill="#4ade80">Network [PRIVATE] </tspan><tspan fill="#64748b">| </tspan><tspan fill="#4ade80">SMB Signing [OK] </tspan><tspan fill="#64748b">| </tspan><tspan fill="#4ade80">Pass Sharing [OFF]</tspan></text>
  <text x="24" y="154" class="term-font"><tspan fill="#38bdf8">======================================================================================</tspan></text>
  <text x="24" y="174" class="term-font"><tspan fill="#94a3b8"></tspan></text>
  <text x="24" y="194" class="term-font"><tspan fill="#facc15">  SELECT REPAIR CATEGORY:</tspan></text>
  <text x="24" y="214" class="term-font"><tspan fill="#94a3b8"></tspan></text>
  <text x="24" y="234" class="term-font"><tspan fill="#4ade80">  [1] Quick &amp; Automated Solutions (ALLFIX &amp; Modern Win 11)</tspan><tspan fill="#f87171">  &lt;-- RECOMMENDED</tspan></text>
  <text x="24" y="254" class="term-font"><tspan fill="#f8fafc">  [2] Fix Specific Error Codes (0x11b, 0x709, 0xbc4, 0x040, etc.)</tspan></text>
  <text x="24" y="274" class="term-font"><tspan fill="#f8fafc">  [3] Network, File &amp; Printer Sharing (SMB) &amp; Firewall</tspan></text>
  <text x="24" y="294" class="term-font"><tspan fill="#f8fafc">  [4] Print Spooler Service &amp; Print Queue Maintenance</tspan></text>
  <text x="24" y="314" class="term-font"><tspan fill="#f8fafc">  [5] Driver Management &amp; Ghost / USB Printer Cleanup</tspan></text>
  <text x="24" y="334" class="term-font"><tspan fill="#f8fafc">  [6] Credentials, Access Rights &amp; Security (Vault, LSA, UAC)</tspan></text>
  <text x="24" y="354" class="term-font"><tspan fill="#f8fafc">  [7] Port Mapping &amp; Manual Connections (UNC Port Map &amp; TCP/IP)</tspan></text>
  <text x="24" y="374" class="term-font"><tspan fill="#f8fafc">  [8] Backup, System Diagnostics &amp; Recovery</tspan></text>
  <text x="24" y="394" class="term-font"><tspan fill="#94a3b8"></tspan></text>
  <text x="24" y="414" class="term-font"><tspan fill="#38bdf8">  [9] Help &amp; Usage Guide</tspan></text>
  <text x="24" y="434" class="term-font"><tspan fill="#facc15">  [L] Switch to Bahasa Indonesia</tspan></text>
  <text x="24" y="454" class="term-font"><tspan fill="#64748b">  [0] Exit Application</tspan></text>
  <text x="24" y="474" class="term-font"><tspan fill="#94a3b8"></tspan></text>
  <text x="24" y="494" class="term-font"><tspan fill="#38bdf8">--------------------------------------------------------------------------------------</tspan></text>
  <text x="24" y="514" class="term-font"><tspan fill="#94a3b8">  [Shortcut Tips]: Enter menu (1-9), press [L] to switch language, or type classic</tspan></text>
  <text x="24" y="534" class="term-font"><tspan fill="#94a3b8">                   codes directly like 84 (AllFix), 83 (Extreme), 64 (Backup), 86 (UNC).</tspan></text>
  <text x="24" y="554" class="term-font"><tspan fill="#38bdf8">--------------------------------------------------------------------------------------</tspan></text>
  <text x="24" y="574" class="term-font"><tspan fill="#facc15">Select option: </tspan><tspan fill="#facc15" class="cursor">&#x2588;</tspan></text>
</svg>

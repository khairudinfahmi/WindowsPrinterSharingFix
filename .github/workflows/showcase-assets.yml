name: Showcase Assets & CI Verification

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build/**'
      - 'docs/**'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag to upload assets (e.g. v2.4.0)'
        required: false
        default: 'v2.4.0'

permissions:
  contents: write

jobs:
  verify-assets:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Dynamic SVGs & Showcase Assets
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build/Generate-ShowcaseAssets.ps1

      - name: Verify Asset Integrity
        shell: pwsh
        run: |
          $required = @(
            "assets/console-preview.svg",
            "assets/console-preview-id.svg",
            "assets/console-preview-submenu7.svg",
            "assets/social-banner.svg",
            "assets/preview-main-menu.png",
            "assets/preview-scanner.png",
            "assets/social-banner.png"
          )
          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              $missing += $file
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "[-] Missing required assets: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "[+] All required showcase assets and dynamic SVGs verified successfully." -ForegroundColor Green

      - name: Upload Assets to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.ref_name }}' } else { '${{ inputs.release_tag }}' }
          Write-Host "Uploading verified assets to release tag: $tag..."
          gh release upload $tag assets/social-banner.png assets/social-banner.svg assets/console-preview.svg assets/console-preview-id.svg assets/console-preview-submenu7.svg assets/preview-main-menu.png assets/preview-scanner.png --clobber

      - name: Publish CI Verification Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## ✅ Dynamic Console Visuals & Showcase Verification`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Asset | Format | Status |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| :--- | :---: | :---: |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/console-preview.svg` | Vector SVG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/console-preview-id.svg` | Vector SVG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/console-preview-submenu7.svg` | Vector SVG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/social-banner.svg` | Vector SVG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/preview-main-menu.png` | Raster PNG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/preview-scanner.png` | Raster PNG | **Verified** |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| `assets/social-banner.png` | Raster PNG | **Verified** |`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "All dynamic vector & showcase assets generated directly from source code and verified with zero errors."
